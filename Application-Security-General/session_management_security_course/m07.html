<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course</title>
  <link rel="stylesheet" href="base.css">
</head>
<body data-course-id="session-management-security">
  <main id="main-content" class="main-content">
    <div class="wrap">
      <section
        id="module-meta"
        data-module="7"
        data-total="10"
        data-audio="m07"
        data-narration="m07"
        aria-labelledby="module-title"
      >
      <header class="card title-card">
        <p class="meta" data-course-title-target>Loading course title...</p>
        <h1 id="module-title" data-module-title-target>Loading module title...</h1>
        <p class="status"><span id="lms-message">Connecting to LMS...</span> <span id="progress">Progress: in progress</span></p>
      </header>

      <figure id="module-graphic-card" class="card graphic-card">
        <img
          class="module-graphic"
          src="course_assets/m07.png"
          alt=""
          aria-label="Expand module graphic"
          tabindex="0"
          role="button"
          aria-expanded="false"
        >
      </figure>

      <section id="module-code-example-card" class="card code-example-card code-example-card-hidden" aria-labelledby="code-examples-heading-m07">
        <h2 id="code-examples-heading-m07">Code Examples</h2>
        <div class="code-example-list" data-code-examples-target>
          <p class="narration-loading">Loading code examples...</p>
        </div>
      </section>

      <nav class="nav module-nav" aria-label="Module navigation">
        <a id="previous-module" class="btn secondary" href="m06.html">Previous</a>
        <a id="next-module" class="btn" href="m08.html">Next</a>
      </nav>

      <section class="card narration-card" aria-labelledby="narration-title">
        <h2 id="narration-title">Narration</h2>
        <div class="narration-text" data-narration-target>
          <p class="narration-loading">Loading narration...</p>
        </div>
      </section>
      </section>
    </div>
  </main>

  <script src="scorm-wrapper.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="course_assets/course.js"></script>
  <script src="course_assets/modules.js"></script>
  <script src="course_assets/m07.js"></script>
  <script src="navigation.js"></script>
  <script src="base.js"></script>
  <script src="syntax-highlighter.js"></script>
  <script src="audio-controls.js"></script>
</body>
</html>
