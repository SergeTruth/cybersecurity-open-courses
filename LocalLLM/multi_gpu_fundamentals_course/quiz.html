<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{QUIZ_TITLE}} | {{COURSE_TITLE}}</title>
  <link rel="stylesheet" href="base.css">
</head>
<body data-course-id="{{COURSE_ID}}">
  <main id="main-content" class="main-content">
    <div class="wrap">
      <section
        id="module-meta"
        data-module="{{MODULE_NUMBER}}"
        data-total="{{TOTAL_MODULES}}"
        data-quiz="true"
        aria-labelledby="module-title"
      >
      <header class="card title-card">
        <p class="meta">{{COURSE_TITLE}}</p>
        <h1 id="module-title">{{QUIZ_TITLE}}</h1>
        <p class="status"><span id="lms-message">Connecting to LMS...</span> <span id="progress">Progress: in progress</span></p>
      </header>

      <section class="card" aria-labelledby="quiz-heading">
        <h2 id="quiz-heading">Assessment</h2>
        <form
          id="quiz-form"
          class="quiz-form"
          data-passing-score="{{PASSING_SCORE}}"
          data-answer-key='{{QUIZ_ANSWER_KEY_JSON}}'
        >
          {{QUIZ_QUESTIONS_HTML}}
          <button id="submit-quiz" type="submit">Submit Quiz</button>
          <p id="quiz-result" aria-live="polite"></p>
        </form>
      </section>

      <nav class="nav module-nav" aria-label="Module navigation">
        <a id="previous-module" class="btn secondary" href="{{PREVIOUS_HREF}}">Previous</a>
      </nav>
      </section>
    </div>
  </main>

  <script id="course-modules-data" type="application/json">
    {{COURSE_MODULES_JSON}}
  </script>
  <script src="scorm-wrapper.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="navigation.js"></script>
  <script src="base.js"></script>
</body>
</html>
