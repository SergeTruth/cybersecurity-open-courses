<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course</title>
  <link rel="stylesheet" href="base.css?v=11">
</head>
<body data-course-id="what_is_incident_response_lifecycle">
  <main id="main-content" class="main-content">
    <div class="wrap">
      <section
        id="module-meta"
        data-module="9"
        data-total="10"
        data-audio="m09"
        data-narration="m09"
        aria-labelledby="module-title"
      >
      <header class="card title-card">
        <h1 id="module-title" data-module-title-target>Loading module title...</h1>
      </header>

      <figure id="module-graphic-card" class="card graphic-card graphic-card-hidden">
        <img
          class="module-graphic"
          src="course_assets/m09.png"
          alt=""
          aria-label="Expand module graphic"
          tabindex="0"
          role="button"
          aria-expanded="false"
        >
      </figure>

      <section id="module-screen-text-card" class="card screen-text-card screen-text-card-hidden" aria-labelledby="screen-text-heading-m09">
        <h2 id="screen-text-heading-m09">Key Points</h2>
        <ul class="screen-text-list" data-screen-text-target></ul>
      </section>

      <section id="module-code-example-card" class="card code-example-card code-example-card-hidden" aria-label="Code examples">
        <div class="code-example-list" data-code-examples-target>
          <p class="narration-loading">Loading code examples...</p>
        </div>
      </section>

      <nav class="nav module-nav" aria-label="Module navigation">
        <a id="previous-module" class="btn secondary" href="#" data-preview-href="m08.html">Previous</a>
        <a id="next-module" class="btn" href="#" data-preview-href="m10.html">Next</a>
      </nav>

      <section class="card narration-card" aria-labelledby="narration-title">
        <h2 id="narration-title">Narration</h2>
        <div class="narration-text" data-narration-target>
          <p class="narration-loading">Loading narration...</p>
        </div>
      </section>
      <footer class="slide-status-footer" role="status" aria-live="polite">
        <span id="lms-message">Connecting to LMS...</span> <span id="progress">Progress: in progress</span>
      </footer>
      </section>
    </div>
  </main>

  <script src="scorm-wrapper.js?v=9"></script>
  <script src="quiz-engine.js"></script>
  <script src="course_assets/course.js"></script>
  <script src="course_assets/modules.js"></script>
  <script src="course_assets/m09.js"></script>
  <script src="navigation.js"></script>
  <script src="base.js?v=9"></script>
  <script src="syntax-highlighter.js"></script>
  <script src="audio-controls.js?v=10"></script>
</body>
</html>
