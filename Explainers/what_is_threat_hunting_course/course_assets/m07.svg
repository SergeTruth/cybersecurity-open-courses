<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Threat Hunting Outcomes">
  <title>Threat Hunting Outcomes - Truth Surge Infographic</title>
  <foreignObject x="0" y="0" width="1920" height="1080">
    <div xmlns="http://www.w3.org/1999/xhtml" class="svg-root">
      <style>
:root{
  --navy:#061832;
  --navy-2:#092a63;
  --electric:#16a8ff;
  --teal:#0f8f9f;
  --amber:#d58b19;
  --slate:#536174;
  --ink:#071733;
  --muted:#516173;
  --line:#c7d8ea;
  --panel:#ffffff;
  --wash:#f3f8fd;
}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#111;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{line-height:1.2}
svg{display:block}
.canvas{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(180deg,#f7fafc 0%,#edf5fb 100%)}
.hero{height:160px;overflow:hidden;background:linear-gradient(100deg,var(--navy),var(--navy-2) 68%,#0a203f);color:#fff;display:flex;align-items:center;padding:18px 42px;border-bottom:6px solid var(--electric)}
.hero-copy{min-width:0}
.hero-kicker{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#9ddfff;margin-bottom:3px}
.hero-title{margin:0;text-transform:uppercase;font-size:43px;line-height:.95;font-weight:900;letter-spacing:0;max-width:1660px}
.hero-title.title-long{font-size:36px}
.hero-title.title-xlong{font-size:32px}
.hero-subtitle{margin:4px 0;color:#8ae6ff;font-size:23px;line-height:1.02;font-weight:800}
.hero-intro{margin:0;max-width:1680px;font-size:17px;line-height:1.12;font-weight:700;color:#eef8ff}
.content{height:920px;padding:20px 24px 22px;display:grid;gap:14px}
.panel{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(28,58,98,.14);overflow:hidden}
.panel-title{height:38px;margin:0;display:flex;align-items:center;justify-content:center;padding:0 14px;color:#fff;text-align:center;text-transform:uppercase;font-size:18px;font-weight:900;letter-spacing:.01em}
.accent-blue{background:linear-gradient(90deg,#082b66,#0b55a7)}
.accent-teal{background:linear-gradient(90deg,#0c6574,#0d8e9d)}
.accent-amber{background:linear-gradient(90deg,#965d07,#c87f12)}
.accent-slate{background:linear-gradient(90deg,#31425a,#59687c)}
.panel-body{padding:16px 18px;min-height:0}
.lead-text{margin:0;font-size:19px;line-height:1.28;font-weight:700;color:#1b2a3d}
.label-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.compact-labels{margin-top:14px}
.label-tile{min-height:66px;border:1px solid #d5e2ef;border-radius:8px;background:#f8fbff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:10px 8px;color:#0b559f}
.label-tile strong{font-size:15px;line-height:1.1;color:#122a47}
.label-tile span{font-size:12px;line-height:1.15;color:var(--muted);font-weight:700}
.callout{margin-top:14px;border:1px solid #bad0e6;background:#eef7ff;border-left:6px solid var(--electric);border-radius:8px;padding:12px 14px;display:block}
.callout p{margin:0;font-size:15px;line-height:1.22;font-weight:800;color:#153252}
.overview-content{grid-template-rows:358px 148px 166px 160px}
.overview-top{display:grid;grid-template-columns:1.05fr .9fr 1.18fr;gap:14px;min-height:0}
.component-grid{display:grid;grid-template-columns:repeat(4,1fr);align-content:start}
.component-grid .label-tile{min-height:78px}
.compare-wrap{padding:12px 14px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #c8d7e8;border-radius:8px;overflow:hidden}
.compare-head{background:#eef5ff;color:#0a3675;font-size:14px;text-align:center;text-transform:uppercase;font-weight:900;padding:9px;border-bottom:1px solid #c8d7e8}
.compare-cell{min-height:59px;padding:8px 11px;border-bottom:1px solid #d9e5f0;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.compare-cell:nth-last-child(-n+2){border-bottom:0}
.compare-left{border-right:1px solid #d9e5f0}
.compare-cell strong{font-size:15px;color:#082d69}
.compare-cell span{color:#44576b}
.architecture-panel .panel-body{height:110px}
.architecture-flow{display:grid;gap:10px;align-items:stretch;padding:14px 18px}
.arch-node{position:relative;border:1px solid #d5e2ef;border-radius:8px;background:#f9fcff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 7px;color:#0b559f}
.arch-node:not(:last-child)::after{content:"";position:absolute;right:-10px;top:50%;width:18px;height:2px;background:#86a9cc}
.arch-node:not(:last-child)::before{content:"";position:absolute;right:-12px;top:calc(50% - 4px);border-left:8px solid #86a9cc;border-top:5px solid transparent;border-bottom:5px solid transparent;z-index:2}
.arch-node strong{font-size:14px;line-height:1.1;color:#102944}
.arch-node span{font-size:11px;font-weight:700;color:var(--muted)}
.step-row{display:grid;gap:12px;padding:14px 16px}
.step-card{position:relative;min-height:100px;border:1px solid #d0deeb;border-radius:8px;background:#f8fbff;padding:12px 10px 10px 47px}
.step-number{position:absolute;left:11px;top:12px;width:27px;height:27px;border-radius:50%;background:#0b5ead;color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.step-card h3{margin:0 0 5px;font-size:15px;line-height:1.08;color:#082f70}
.step-card p{margin:0;font-size:12.7px;line-height:1.14;font-weight:700;color:#45586c}
.overview-bottom{display:grid;grid-template-columns:1.18fr .82fr;gap:14px;min-height:0}
.principle-row{display:grid;gap:0;padding:0;height:122px}
.principle{border-right:1px solid #dce7f2;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 10px;color:#0d6b7d}
.principle:last-child{border-right:0}
.principle strong{font-size:15px;line-height:1.1;color:#102944}
.principle span{margin-top:4px;font-size:11.5px;line-height:1.1;color:var(--muted);font-weight:700}
.takeaway-panel{border:2px solid #1477c8;background:linear-gradient(120deg,#ffffff,#eff8ff);display:flex;align-items:center;padding:20px 28px}
.takeaway-panel h2{margin:0 0 7px;font-size:22px;text-transform:uppercase;color:#082f70}
.takeaway-panel p{margin:0;font-size:18px;line-height:1.22;font-weight:800;color:#1b2f48}
.process-content{grid-template-rows:480px 140px 230px}
.process-top{display:grid;grid-template-columns:420px 1fr 420px;gap:14px;min-height:0}
.bullet-list{display:grid;gap:12px;align-content:start}
.bullet-item{display:block;border:1px solid #d5e2ef;border-radius:8px;background:#f8fbff;padding:13px 14px;color:#0b559f}
.bullet-item p{margin:0;font-size:16px;line-height:1.22;font-weight:800;color:#1d3048}
.cycle-board{position:relative;height:442px;padding:0}
.cycle-center{position:absolute;left:50%;top:50%;width:296px;height:296px;transform:translate(-50%,-50%);border:5px solid #9cbddf;border-radius:50%;background:transparent}
.cycle-stage{position:absolute;width:222px;min-height:86px;background:#fff;border:2px solid #9cbddf;border-radius:8px;padding:10px;text-align:center;box-shadow:0 2px 7px rgba(28,58,98,.13)}
.cycle-stage b{display:block;margin-bottom:5px;color:#083575;font-size:15.5px;line-height:1.1}
.cycle-stage span{font-size:12.5px;line-height:1.13;font-weight:700;color:#4a5d71}
.pos-0{left:50%;top:10px;transform:translateX(-50%)}
.pos-1{right:42px;top:82px}
.pos-2{right:42px;bottom:82px}
.pos-3{left:50%;bottom:10px;transform:translateX(-50%)}
.pos-4{left:42px;bottom:82px}
.pos-5{left:42px;top:82px}
.role-lane{display:grid;gap:0;padding:0;height:102px}
.role-card{border-right:1px solid #dce7f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:11px 10px;color:#0b559f}
.role-card:last-child{border-right:0}
.role-card strong{font-size:15px;line-height:1.1;color:#102944}
.role-card span{margin-top:4px;font-size:11.5px;line-height:1.1;font-weight:700;color:var(--muted)}
.process-bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;min-height:0}
.metric-list{display:grid;gap:10px;align-content:start}
.metric-row{border-left:5px solid var(--electric);background:#f8fbff;border-radius:8px;padding:10px 12px}
.metric-row strong{display:block;margin-bottom:3px;color:#082f70;font-size:15px;text-transform:uppercase}
.metric-row span{font-size:14px;line-height:1.2;font-weight:700;color:#40556c}
.compact-list{display:grid;gap:10px;align-content:start}
.compact-item{display:block;border:1px solid #d5e2ef;border-radius:8px;background:#f8fbff;padding:8px 10px;color:#0b559f}
.compact-item p{margin:0;font-size:14px;line-height:1.18;font-weight:800;color:#1d3048}
.process-bottom .metric-list{padding:10px 12px;gap:7px}
.process-bottom .compact-list,.mapping-bottom .compact-list,.mapping-bottom .evidence-grid{padding:12px 14px;gap:8px}
.process-bottom .metric-row{padding:6px 8px}
.process-bottom .metric-row strong{font-size:12.5px}
.process-bottom .metric-row span{font-size:12.2px;line-height:1.12}
.process-bottom .compact-item,.mapping-bottom .compact-item{padding:7px 9px}
.process-bottom .compact-item p,.mapping-bottom .compact-item p{font-size:13px;line-height:1.12}
.mapping-content{grid-template-rows:156px 500px 190px}
.mapping-top{display:grid;grid-template-columns:1fr 120px 1fr;gap:14px;align-items:stretch;min-height:0}
.framework-card{padding:20px 26px}
.framework-label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0b74b8;font-weight:900;margin-bottom:7px}
.framework-name{font-size:25px;font-weight:900;color:#082f70;margin-bottom:8px}
.framework-card p{margin:0;font-size:18px;line-height:1.22;font-weight:750;color:#253850}
.mapping-connector{display:flex;align-items:center;justify-content:center;color:#0b65b8;text-transform:uppercase;font-size:16px;font-weight:900;letter-spacing:.08em}
.matrix-panel{min-height:0}
.mapping-table{display:grid;grid-template-columns:1.05fr 1.05fr 1.42fr 1.35fr}
.table-head{height:42px;background:#eef5ff;color:#083575;text-align:center;text-transform:uppercase;font-size:15px;font-weight:900;padding:12px 8px;border-bottom:1px solid #c8d7e8;border-right:1px solid #c8d7e8}
.table-head:nth-child(4){border-right:0}
.table-cell{min-height:69px;border-bottom:1px solid #dce7f2;border-right:1px solid #dce7f2;padding:10px 12px;font-size:14.8px;line-height:1.18;font-weight:750;color:#33475e}
.table-cell:nth-child(4n){border-right:0}
.table-cell:nth-last-child(-n+4){border-bottom:0}
.table-cell strong{font-size:15.5px;color:#082f70}
.mapping-bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;min-height:0}
.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.evidence-pill{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #d2e1ef;border-radius:8px;background:#f8fbff;padding:6px 8px;color:#0b559f}
.evidence-pill strong{font-size:13px;line-height:1.08;color:#172e49}

.svg-root{width:1920px;height:1080px;margin:0;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
      </style>
      <main class="canvas canvas-process" aria-label="Threat Hunting Outcomes">
    <header class="hero">
      <div class="hero-copy">
        <div class="hero-kicker">Truth Surge Cybersecurity Training</div>
        <h1 class="hero-title ">Threat Hunting Outcomes</h1>
        <h2 class="hero-subtitle">Measure defensive learning, not only confirmed threats.</h2>
        <p class="hero-intro">A hunt can improve telemetry, detections, asset knowledge, baselines, incident handoffs, and future questions whether or not it confirms malicious activity.</p>
      </div>
    </header>
    <section class="content process-content">
      <section class="process-top">
      <article class="panel why-panel">
        <h2 class="panel-title accent-blue">Why It Matters</h2>
        <div class="panel-body bullet-list">
          <div class="bullet-item">
            <p>Confirmed suspicious activity is valuable, but it is only one possible hunt outcome.</p>
          </div>
          <div class="bullet-item">
            <p>Normal activity builds baselines that make meaningful deviations easier to recognize.</p>
          </div>
          <div class="bullet-item">
            <p>Documented gaps and recommendations turn investigation effort into lasting defensive value.</p>
          </div>
        </div>
      </article>
      <article class="panel cycle-panel">
        <h2 class="panel-title accent-teal">Outcome-to-Improvement Loop</h2>
        <div class="panel-body cycle-board">
          <div class="cycle-center" aria-hidden="true"></div>
          <article class="cycle-stage pos-0">
            <b>1. Conclude</b>
            <span>Separate observed facts, interpretation, limitations, and recommendations.</span>
          </article>
          <article class="cycle-stage pos-1">
            <b>2. Close Data Gaps</b>
            <span>Restore missing systems, fields, retention, timestamps, and coverage.</span>
          </article>
          <article class="cycle-stage pos-2">
            <b>3. Improve Detection</b>
            <span>Test useful patterns, review noise, and operationalize repeatable analytics.</span>
          </article>
          <article class="cycle-stage pos-3">
            <b>4. Clarify Assets</b>
            <span>Resolve unknown systems, ownership, business roles, and support paths.</span>
          </article>
          <article class="cycle-stage pos-4">
            <b>5. Handoff Events</b>
            <span>Move credible evidence into the established incident process with context.</span>
          </article>
          <article class="cycle-stage pos-5">
            <b>6. Generate Questions</b>
            <span>Use lessons to automate recurring work and shape future hypotheses.</span>
          </article>
        </div>
      </article>
      <article class="panel failure-panel">
        <h2 class="panel-title accent-amber">Common Failure Modes</h2>
        <div class="panel-body bullet-list">
          <div class="bullet-item">
            <p>Judging success only by the number of confirmed threats discovered.</p>
          </div>
          <div class="bullet-item">
            <p>Mixing facts, interpretations, and recommendations in hunt reporting.</p>
          </div>
          <div class="bullet-item">
            <p>Creating an analytic without testing history, false positives, or workflow fit.</p>
          </div>
          <div class="bullet-item">
            <p>Allowing a hunt to bypass the controlled incident-response process.</p>
          </div>
        </div>
      </article>
      </section>
      <article class="panel roles-panel">
        <h2 class="panel-title accent-slate">Roles Across the Process</h2>
        <div class="panel-body role-lane" style="grid-template-columns: repeat(6, 1fr);">
          <div class="role-card">
            <strong>Hunters</strong>
            <span>evidence and limits</span>
          </div>
          <div class="role-card">
            <strong>Platform Teams</strong>
            <span>telemetry quality</span>
          </div>
          <div class="role-card">
            <strong>Detection Engineers</strong>
            <span>tested analytics</span>
          </div>
          <div class="role-card">
            <strong>Asset Owners</strong>
            <span>roles and context</span>
          </div>
          <div class="role-card">
            <strong>Incident Responders</strong>
            <span>controlled action</span>
          </div>
          <div class="role-card">
            <strong>Leaders</strong>
            <span>concise risk view</span>
          </div>
        </div>
      </article>
      <section class="process-bottom">
      <article class="panel metric-panel">
        <h2 class="panel-title accent-blue">Metrics That Matter</h2>
        <div class="panel-body metric-list">
          <div class="metric-row">
            <strong>Coverage</strong>
            <span>Telemetry and asset gaps are identified, owned, and resolved.</span>
          </div>
          <div class="metric-row">
            <strong>Detection Value</strong>
            <span>New or tuned analytics improve signal and analyst workflow.</span>
          </div>
          <div class="metric-row">
            <strong>Reusable Learning</strong>
            <span>Methods, baselines, and recurring questions inform future hunts.</span>
          </div>
        </div>
      </article>
      <article class="panel decision-panel">
        <h2 class="panel-title accent-teal">Decision Points</h2>
        <div class="panel-body compact-list">
          <div class="compact-item">
            <p>Escalate when evidence indicates an active security event.</p>
          </div>
          <div class="compact-item">
            <p>Engineer a detection when a useful pattern can be repeated reliably.</p>
          </div>
          <div class="compact-item">
            <p>Assign remediation when telemetry, ownership, or governance blocks analysis.</p>
          </div>
          <div class="compact-item">
            <p>Record normal behavior when it improves the environment baseline.</p>
          </div>
        </div>
      </article>
      <article class="panel takeaway-panel">
        <div>
          <h2>Key Takeaway</h2>
          <p>The lasting value of hunting is measurable defensive improvement: better visibility, stronger detections, cleaner handoffs, clearer ownership, and sharper future questions.</p>
        </div>
      </article>
      </section>
    </section>
      </main>
    </div>
  </foreignObject>
</svg>
