<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{MODULE_TITLE}} | {{COURSE_TITLE}}</title>
  <link rel="stylesheet" href="base.css">
</head>
<body data-course-id="{{COURSE_ID}}">
  <main id="main-content" class="main-content">
    <div class="wrap">
      <section
        id="module-meta"
        data-module="{{MODULE_NUMBER}}"
        data-total="{{TOTAL_MODULES}}"
        data-audio="{{AUDIO_BASE}}"
        aria-labelledby="module-title"
      >
      <header class="card title-card">
        <p class="meta">{{COURSE_TITLE}}</p>
        <h1 id="module-title">{{MODULE_TITLE}}</h1>
        <p class="status"><span id="lms-message">Connecting to LMS...</span> <span id="progress">Progress: in progress</span></p>
      </header>

      <figure class="card graphic-card">
        <img
          class="module-graphic"
          src="placeholder.png"
          alt="{{GRAPHIC_ALT}}"
          tabindex="0"
          role="button"
          aria-expanded="false"
        >
      </figure>

      <nav class="nav module-nav" aria-label="Module navigation">
        <a id="previous-module" class="btn secondary" href="{{PREVIOUS_HREF}}">Previous</a>
        <a id="next-module" class="btn" href="{{NEXT_HREF}}">Next</a>
      </nav>

      <section class="card narration-card" aria-labelledby="narration-title">
        <h2 id="narration-title">Narration</h2>
        <div class="narration-text">
          {{NARRATION_HTML}}
        </div>
      </section>
      </section>
    </div>
  </main>

  <script id="course-modules-data" type="application/json">
    {{COURSE_MODULES_JSON}}
  </script>
  <script src="scorm-wrapper.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="navigation.js"></script>
  <script src="audio-controls.js"></script>
  <script src="base.js"></script>
</body>
</html>
